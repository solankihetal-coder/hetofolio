<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · Hetal Solanki</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#f6f5f1}
    .error-page{width:min(760px,calc(100% - 32px));padding:60px 0;text-align:center}
    .error-code{font-size:clamp(6rem,20vw,12rem);line-height:.8;letter-spacing:-.08em;font-weight:800}
    .error-page h1{margin-top:24px;font-size:clamp(2rem,5vw,4rem);letter-spacing:-.05em}
    .error-page p{max-width:520px;margin:16px auto 28px;color:#6e6e6e}
    .error-page .btn{display:inline-flex}
  </style>
</head>
<body>
  <main class="error-page">
    <p class="eyebrow">( 404 )</p>
    <div class="error-code">Oops.</div>
    <h1>This page wandered off.</h1>
    <p>The page you're looking for doesn't exist here. Let's get you back to the portfolio.</p>
    <a class="btn btn-dark" href="index.html">Back home <i class="fa-solid fa-arrow-right"></i></a>
  </main>
</body>
</html>
